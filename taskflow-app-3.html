<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Manage Your Day</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090c;
    --surface: #111318;
    --card: #181c24;
    --card2: #1e2330;
    --border: #252b38;
    --border2: #2e3645;
    --accent: #00d4ff;
    --accent-dim: rgba(0,212,255,0.12);
    --accent2: #7c3aed;
    --success: #00e5a0;
    --warning: #ffb800;
    --danger: #ff4757;
    --text: #eef0f6;
    --muted: #5a6378;
    --muted2: #8892a4;
    --high: #ff4757;
    --medium: #ffb800;
    --low: #00e5a0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cabinet Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── AUTH ─── */
  #auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .auth-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 10% 60%, rgba(0,212,255,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 90% 20%, rgba(124,58,237,0.07) 0%, transparent 70%);
  }

  .auth-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.3;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
  }

  .auth-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 52px 44px;
    width: 440px;
    max-width: calc(100vw - 32px);
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(0,212,255,0.05), 0 40px 100px rgba(0,0,0,0.6);
    animation: authAppear 0.7s cubic-bezier(0.16,1,0.3,1);
  }

  @keyframes authAppear {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }

  .brand-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .brand-name {
    font-family: 'Clash Display', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--text), var(--muted2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .auth-tagline {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
    font-weight: 400;
  }

  .tab-row {
    display: flex;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    gap: 4px;
  }

  .tab-btn {
    flex: 1; padding: 10px;
    border: none; border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.25s;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent), #00a8cc);
    color: #000;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,212,255,0.3);
  }

  .fld { margin-bottom: 16px; }

  .fld label {
    display: block;
    font-size: 12px;
    color: var(--muted2);
    margin-bottom: 7px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .fld input {
    width: 100%;
    padding: 13px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 15px;
    outline: none;
    transition: all 0.2s;
  }

  .fld input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }

  .err-msg {
    color: var(--danger);
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
    padding: 10px 14px;
    background: rgba(255,71,87,0.08);
    border: 1px solid rgba(255,71,87,0.2);
    border-radius: 8px;
  }

  .btn-main {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #00a8cc);
    border: none;
    border-radius: 11px;
    color: #000;
    font-family: 'Clash Display', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.2px;
    box-shadow: 0 4px 20px rgba(0,212,255,0.25);
  }

  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,212,255,0.4); }
  .btn-main:active { transform: translateY(0); }

  /* ─── APP ─── */
  #app { display: none; min-height: 100vh; flex-direction: column; }

  header {
    background: rgba(17,19,24,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }

  .h-brand {
    display: flex; align-items: center; gap: 10px;
  }

  .h-brand-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .h-brand-name {
    font-family: 'Clash Display', sans-serif;
    font-weight: 700;
    font-size: 20px;
    background: linear-gradient(90deg, var(--text), var(--muted2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .h-right { display: flex; align-items: center; gap: 12px; }

  .user-pill {
    display: flex; align-items: center; gap: 9px;
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 50px;
    padding: 5px 14px 5px 5px;
  }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Clash Display', sans-serif;
    font-weight: 700; font-size: 13px; color: #000;
  }

  .u-name { font-size: 14px; font-weight: 500; }

  .btn-out {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    font-family: 'Cabinet Grotesk', sans-serif;
  }

  .btn-out:hover { border-color: var(--danger); color: var(--danger); }

  main {
    flex: 1;
    padding: 36px 32px;
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
  }

  .page-header {
    margin-bottom: 32px;
  }

  .page-title {
    font-family: 'Clash Display', sans-serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .page-title span { color: var(--accent); }

  .page-sub { color: var(--muted); font-size: 15px; }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }

  .sc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    cursor: default;
  }

  .sc:hover { transform: translateY(-3px); border-color: var(--border2); }

  .sc-glow {
    position: absolute;
    top: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    opacity: 0.15;
    filter: blur(20px);
  }

  .sc.s1 .sc-glow { background: var(--accent); }
  .sc.s2 .sc-glow { background: var(--warning); }
  .sc.s3 .sc-glow { background: var(--success); }
  .sc.s4 .sc-glow { background: var(--danger); }

  .sc-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .sc-num {
    font-family: 'Clash Display', sans-serif;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }

  .sc.s1 .sc-num { color: var(--accent); }
  .sc.s2 .sc-num { color: var(--warning); }
  .sc.s3 .sc-num { color: var(--success); }
  .sc.s4 .sc-num { color: var(--danger); }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .prog-label { font-size: 13px; color: var(--muted2); white-space: nowrap; }
  .prog-bar-bg { flex: 1; height: 8px; background: var(--card2); border-radius: 99px; overflow: hidden; }
  .prog-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 99px; transition: width 0.5s ease; }
  .prog-pct { font-family: 'Clash Display', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }

  /* TOOLBAR */
  .toolbar {
    display: flex; gap: 10px;
    margin-bottom: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap { flex: 1; min-width: 180px; position: relative; }

  .search-wrap input {
    width: 100%;
    padding: 11px 14px 11px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 14px; outline: none;
    transition: all 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }
  .s-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; }

  .f-btn {
    padding: 11px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
    font-family: 'Cabinet Grotesk', sans-serif;
    white-space: nowrap;
  }

  .f-btn.on, .f-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn-new {
    display: flex; align-items: center; gap: 6px;
    padding: 11px 22px;
    background: linear-gradient(135deg, var(--accent), #00a8cc);
    border: none; border-radius: 11px;
    color: #000;
    font-family: 'Clash Display', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,212,255,0.2);
  }

  .btn-new:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.35); }

  /* TASK GRID */
  .tgrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  .tc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    transition: all 0.25s;
    animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1);
    position: relative;
    overflow: hidden;
  }

  .tc::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    transition: opacity 0.2s;
    opacity: 0.7;
  }

  .tc.high::before { background: linear-gradient(90deg, var(--danger), transparent); }
  .tc.medium::before { background: linear-gradient(90deg, var(--warning), transparent); }
  .tc.low::before { background: linear-gradient(90deg, var(--success), transparent); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tc:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
  .tc.done { opacity: 0.5; }
  .tc.done .t-title { text-decoration: line-through; color: var(--muted); }

  .t-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }

  .t-title {
    font-family: 'Clash Display', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    flex: 1;
  }

  .pbadge {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }

  .pbadge.high { background: rgba(255,71,87,0.12); color: var(--high); border: 1px solid rgba(255,71,87,0.2); }
  .pbadge.medium { background: rgba(255,184,0,0.12); color: var(--medium); border: 1px solid rgba(255,184,0,0.2); }
  .pbadge.low { background: rgba(0,229,160,0.12); color: var(--low); border: 1px solid rgba(0,229,160,0.2); }

  .t-desc {
    font-size: 13px;
    color: var(--muted2);
    line-height: 1.55;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .t-foot { display: flex; align-items: center; justify-content: space-between; }

  .t-date {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
  }

  .t-date.late { color: var(--danger); }

  .t-actions { display: flex; gap: 6px; }

  .ab {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
  }

  .ab:hover.ck { border-color: var(--success); color: var(--success); background: rgba(0,229,160,0.08); }
  .ab:hover.ed { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .ab:hover.dl { border-color: var(--danger); color: var(--danger); background: rgba(255,71,87,0.08); }
  .ab.checked { border-color: var(--success); color: var(--success); background: rgba(0,229,160,0.1); }

  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
  }

  .empty-ico { font-size: 52px; margin-bottom: 18px; opacity: 0.4; }
  .empty-t { font-family: 'Clash Display', sans-serif; font-size: 20px; font-weight: 700; color: var(--muted2); margin-bottom: 8px; }
  .empty-s { font-size: 14px; }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center; justify-content: center;
  }

  .overlay.open { display: flex; animation: fIn 0.2s ease; }
  @keyframes fIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 22px;
    padding: 38px;
    width: 500px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    animation: mIn 0.35s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,212,255,0.05);
  }

  @keyframes mIn {
    from { opacity: 0; transform: scale(0.91) translateY(24px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .m-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

  .m-title {
    font-family: 'Clash Display', sans-serif;
    font-size: 22px; font-weight: 700;
  }

  .m-close {
    width: 34px; height: 34px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
  }

  .m-close:hover { border-color: var(--danger); color: var(--danger); }

  .modal .fld { margin-bottom: 18px; }

  .modal textarea {
    width: 100%;
    padding: 13px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 15px;
    outline: none; resize: vertical; min-height: 90px;
    transition: all 0.2s;
  }

  .modal textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }

  .modal select {
    width: 100%;
    padding: 13px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--text);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 15px;
    outline: none; cursor: pointer; appearance: none;
    transition: all 0.2s;
  }

  .modal select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.08); }

  .m-btns { display: flex; gap: 10px; margin-top: 8px; }

  .btn-cancel {
    flex: 1; padding: 13px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--muted);
    font-family: 'Cabinet Grotesk', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }
  .m-btns .btn-main { flex: 2; width: auto; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--card2);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 16px 22px;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 500;
    z-index: 9999;
    animation: tIn 0.35s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }

  @keyframes tIn {
    from { opacity: 0; transform: translateX(24px) scale(0.95); }
    to { opacity: 1; transform: translateX(0) scale(1); }
  }

  .toast.ok { border-color: rgba(0,229,160,0.3); }
  .toast.err { border-color: rgba(255,71,87,0.3); }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 768px) {
    main { padding: 20px 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header { padding: 0 16px; }
    .page-title { font-size: 24px; }
    .h-brand-name { display: none; }
  }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-bg"></div>
  <div class="auth-grid"></div>
  <div class="auth-box">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-name">TaskFlow</div>
    </div>
    <p class="auth-tagline">Organize your day. Get things done.</p>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="fld">
        <label>Username</label>
        <input type="text" id="lu" placeholder="Enter your username" />
      </div>
      <div class="fld">
        <label>Password</label>
        <input type="password" id="lp" placeholder="Enter your password" onkeydown="if(event.key==='Enter')login()" />
      </div>
      <p class="err-msg" id="le">Incorrect username or password</p>
      <button class="btn-main" onclick="login()">Sign In →</button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <div class="fld">
        <label>Full Name</label>
        <input type="text" id="rn" placeholder="Your name" />
      </div>
      <div class="fld">
        <label>Username</label>
        <input type="text" id="ru" placeholder="Choose a username" />
      </div>
      <div class="fld">
        <label>Password</label>
        <input type="password" id="rp" placeholder="Create a password" />
      </div>
      <p class="err-msg" id="re">Username already taken</p>
      <button class="btn-main" onclick="register()">Create Account →</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="h-brand">
      <div class="h-brand-icon">⚡</div>
      <div class="h-brand-name">TaskFlow</div>
    </div>
    <div class="h-right">
      <div class="user-pill">
        <div class="avatar" id="uav">U</div>
        <span class="u-name" id="uname">User</span>
      </div>
      <button class="btn-out" onclick="logout()">Sign out</button>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="page-title">Your <span>Dashboard</span></div>
      <div class="page-sub" id="greeting">Welcome back! Here's your task overview.</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="sc s1">
        <div class="sc-glow"></div>
        <div class="sc-label">Total Tasks</div>
        <div class="sc-num" id="st">0</div>
      </div>
      <div class="sc s2">
        <div class="sc-glow"></div>
        <div class="sc-label">Pending</div>
        <div class="sc-num" id="sp">0</div>
      </div>
      <div class="sc s3">
        <div class="sc-glow"></div>
        <div class="sc-label">Completed</div>
        <div class="sc-num" id="sc2">0</div>
      </div>
      <div class="sc s4">
        <div class="sc-glow"></div>
        <div class="sc-label">High Priority</div>
        <div class="sc-num" id="sh">0</div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap">
      <span class="prog-label">Overall Progress</span>
      <div class="prog-bar-bg"><div class="prog-bar-fill" id="pbar" style="width:0%"></div></div>
      <span class="prog-pct" id="ppct">0%</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="s-ico">🔍</span>
        <input type="text" id="srch" placeholder="Search tasks..." oninput="render()" />
      </div>
      <button class="f-btn on" id="fa" onclick="filt('all')">All</button>
      <button class="f-btn" id="fp" onclick="filt('pending')">Pending</button>
      <button class="f-btn" id="fc" onclick="filt('done')">Completed</button>
      <button class="btn-new" onclick="openAdd()">＋ New Task</button>
    </div>

    <!-- Grid -->
    <div class="tgrid" id="tgrid"></div>
  </main>
</div>

<!-- MODAL -->
<div class="overlay" id="modal">
  <div class="modal">
    <div class="m-head">
      <div class="m-title" id="mtitle">New Task</div>
      <button class="m-close" onclick="closeM()">✕</button>
    </div>
    <div class="fld">
      <label>Task Title *</label>
      <input type="text" id="mti" placeholder="What needs to be done?" />
    </div>
    <div class="fld">
      <label>Description</label>
      <textarea id="mdi" placeholder="Add details (optional)..."></textarea>
    </div>
    <div class="fld">
      <label>Priority Level</label>
      <select id="mpi">
        <option value="high">🔴 High Priority</option>
        <option value="medium" selected>🟡 Medium Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
    </div>
    <div class="fld">
      <label>Deadline</label>
      <input type="date" id="mdi2" />
    </div>
    <div class="m-btns">
      <button class="btn-cancel" onclick="closeM()">Cancel</button>
      <button class="btn-main" onclick="save()">Save Task →</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let users = JSON.parse(localStorage.getItem('tf2_users') || '[]');
let tasks = JSON.parse(localStorage.getItem('tf2_tasks') || '[]');
let cu = null; // current user
let eid = null; // editing id
let cf = 'all'; // current filter

// ── Auth ──
function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', t==='login'?i===0:i===1));
  document.getElementById('login-form').style.display = t==='login'?'block':'none';
  document.getElementById('register-form').style.display = t==='register'?'block':'none';
}

function login() {
  const u = v('lu'), p = v('lp');
  const found = users.find(x => x.u===u && x.p===p);
  if (!found) { show('le'); return; }
  hide('le'); cu = found; startApp();
}

function register() {
  const n = v('rn'), u = v('ru'), p = v('rp');
  if (!n||!u||!p) { toast('Please fill all fields','err'); return; }
  if (users.find(x=>x.u===u)) { show('re'); return; }
  hide('re');
  cu = { id: Date.now(), n, u, p };
  users.push(cu); saveU(); startApp();
  toast('Welcome to TaskFlow! 🎉','ok');
}

function logout() {
  cu = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('lu').value = '';
  document.getElementById('lp').value = '';
}

function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('uname').textContent = cu.n;
  document.getElementById('uav').textContent = cu.n[0].toUpperCase();
  const h = new Date().getHours();
  const greet = h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').textContent = `${greet}, ${cu.n}! Here's your task overview.`;
  render();
}

// ── Tasks ──
function mine() { return tasks.filter(t=>t.uid===cu.id); }

function filt(f) {
  cf = f;
  ['fa','fp','fc'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById(f==='all'?'fa':f==='pending'?'fp':'fc').classList.add('on');
  render();
}

function render() {
  const q = document.getElementById('srch').value.toLowerCase();
  let list = mine();
  if (cf==='pending') list = list.filter(t=>!t.done);
  if (cf==='done') list = list.filter(t=>t.done);
  if (q) list = list.filter(t=>t.ti.toLowerCase().includes(q)||(t.di||'').toLowerCase().includes(q));

  const all = mine();
  const total = all.length;
  const done = all.filter(t=>t.done).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  document.getElementById('st').textContent = total;
  document.getElementById('sp').textContent = all.filter(t=>!t.done).length;
  document.getElementById('sc2').textContent = done;
  document.getElementById('sh').textContent = all.filter(t=>t.pr==='high'&&!t.done).length;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ppct').textContent = pct + '%';

  const grid = document.getElementById('tgrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-ico">📋</div><div class="empty-t">No tasks here</div><div class="empty-s">Click "New Task" to add your first task</div></div>`;
    return;
  }

  list.sort((a,b) => ({high:0,medium:1,low:2}[a.pr]||1) - ({high:0,medium:1,low:2}[b.pr]||1));

  grid.innerHTML = list.map(t => {
    const over = t.dl && !t.done && new Date(t.dl) < new Date();
    const dlStr = t.dl ? new Date(t.dl+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : 'No deadline';
    return `
    <div class="tc ${t.pr} ${t.done?'done':''}">
      <div class="t-top">
        <div class="t-title">${esc(t.ti)}</div>
        <span class="pbadge ${t.pr}">${t.pr}</span>
      </div>
      ${t.di?`<div class="t-desc">${esc(t.di)}</div>`:''}
      <div class="t-foot">
        <div class="t-date ${over?'late':''}">📅 ${dlStr}${over?' · Overdue':''}</div>
        <div class="t-actions">
          <button class="ab ck ${t.done?'checked':''}" title="${t.done?'Mark pending':'Mark done'}" onclick="toggle(${t.id})">${t.done?'↩':'✓'}</button>
          <button class="ab ed" title="Edit" onclick="openEdit(${t.id})">✎</button>
          <button class="ab dl" title="Delete" onclick="del(${t.id})">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;
  t.done = !t.done;
  saveT(); render();
  toast(t.done?'Task completed! ✅':'Marked as pending','ok');
}

function del(id) {
  tasks = tasks.filter(x=>x.id!==id);
  saveT(); render(); toast('Task deleted','err');
}

// ── Modal ──
function openAdd() {
  eid = null;
  document.getElementById('mtitle').textContent = 'New Task';
  document.getElementById('mti').value = '';
  document.getElementById('mdi').value = '';
  document.getElementById('mpi').value = 'medium';
  document.getElementById('mdi2').value = '';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('mti').focus(), 100);
}

function openEdit(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;
  eid = id;
  document.getElementById('mtitle').textContent = 'Edit Task';
  document.getElementById('mti').value = t.ti;
  document.getElementById('mdi').value = t.di||'';
  document.getElementById('mpi').value = t.pr;
  document.getElementById('mdi2').value = t.dl||'';
  document.getElementById('modal').classList.add('open');
}

function closeM() { document.getElementById('modal').classList.remove('open'); }

function save() {
  const ti = document.getElementById('mti').value.trim();
  if (!ti) { toast('Please enter a task title','err'); return; }
  const d = {
    ti,
    di: document.getElementById('mdi').value.trim(),
    pr: document.getElementById('mpi').value,
    dl: document.getElementById('mdi2').value,
    uid: cu.id
  };
  if (eid) {
    Object.assign(tasks.find(x=>x.id===eid), d);
    toast('Task updated ✏️','ok');
  } else {
    tasks.push({ id: Date.now(), done: false, ...d });
    toast('Task added! 🚀','ok');
  }
  saveT(); closeM(); render();
}

document.getElementById('modal').addEventListener('click', function(e) { if(e.target===this) closeM(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeM(); });

// ── Storage ──
function saveU() { localStorage.setItem('tf2_users', JSON.stringify(users)); }
function saveT() { localStorage.setItem('tf2_tasks', JSON.stringify(tasks)); }

// ── Utils ──
function v(id) { return document.getElementById(id).value.trim(); }
function show(id) { document.getElementById(id).style.display='block'; }
function hide(id) { document.getElementById(id).style.display='none'; }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type='ok') {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='ok'?'✅':'🗑️'}</span> ${msg}`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(20px)'; el.style.transition='all 0.3s'; setTimeout(()=>el.remove(),300); }, 2800);
}
</script>
</body>
</html>
